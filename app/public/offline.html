<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0891b2" />
    <title>Polibeli Dashboard Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: #020617;
        color: #e5eefb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(145deg, rgba(8, 145, 178, 0.22), transparent 42%),
          linear-gradient(315deg, rgba(99, 102, 241, 0.18), transparent 48%),
          #020617;
      }

      main {
        width: min(480px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        padding: 28px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(34, 211, 238, 0.32);
        border-radius: 8px;
        color: #a5f3fc;
        background: rgba(8, 145, 178, 0.12);
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 10px;
        font-size: clamp(28px, 8vw, 42px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.7;
      }

      button {
        margin-top: 24px;
        width: 100%;
        border: 1px solid rgba(34, 211, 238, 0.38);
        border-radius: 8px;
        background: #0891b2;
        color: #ecfeff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Offline mode</div>
      <h1>Koneksi sedang terputus</h1>
      <p>
        Polibeli Dashboard sudah terpasang sebagai aplikasi, tetapi data analytics terbaru tetap membutuhkan koneksi.
        Sambungkan internet lalu muat ulang halaman.
      </p>
      <button type="button" onclick="window.location.reload()">Muat ulang</button>
    </main>
  </body>
</html>
